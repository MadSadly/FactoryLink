name: Deploy Factory-Link

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Spring Boot
        working-directory: server-spring
        run: chmod +x mvnw && ./mvnw -B -DskipTests package

      - name: Build Node Server
        working-directory: server-node
        run: npm install

      - name: Build Client
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Build AI Server
        working-directory: server-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build (all services)
        run: docker compose -f devops/docker-compose.yml build

      - name: Deploy Placeholder
        run: echo "배포 단계는 클라우드 환경(AWS/GCP/Azure)에 맞춰 확장하세요."
