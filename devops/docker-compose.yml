version: "3.9"
# Run: docker compose --env-file devops/.env -f devops/docker-compose.yml up --build

services:
  mariadb:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: factory_link
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server-spring:
    build:
      context: ../server-spring
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: factory_link
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AI_SERVER_URL: http://server-ai:8000
    depends_on:
      mariadb:
        condition: service_healthy

  server-node:
    build:
      context: ../server-node
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: factory_link
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      mariadb:
        condition: service_healthy

  server-ai:
    build:
      context: ../server-ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: factory_link
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      mariadb:
        condition: service_healthy

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3001}
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - server-spring
      - server-node
      - server-ai

volumes:
  mariadb_data:
